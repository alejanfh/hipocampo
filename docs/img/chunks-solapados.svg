<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Chunking por encabezados con solape</title>
  <desc id="d">Una Nota con tres secciones se trocea en cuatro Chunks. La sección larga de Reembolsos se parte en dos Chunks que comparten unos 50 tokens. Cada Chunk se convierte en un vector, y los cuatro apuntan a la misma Nota, que es lo que se cita.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fde68a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d97706" stroke-width="3"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="820" height="490" rx="14" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Una Nota, cuatro Chunks, una sola Cita</text>

  <!-- la Nota -->
  <rect x="20" y="50" width="290" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="76" font-size="13" font-weight="700" fill="#0f172a"># Política de cancelaciones</text>
  <g font-size="12" font-weight="600" fill="#334155">
    <text x="36" y="106">## Plazos</text>
    <text x="36" y="176">## Reembolsos</text>
    <text x="36" y="360">## Excepciones</text>
  </g>
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
    <line x1="36" y1="120" x2="280" y2="120"/><line x1="36" y1="134" x2="250" y2="134"/><line x1="36" y1="148" x2="200" y2="148"/>
    <line x1="36" y1="190" x2="280" y2="190"/><line x1="36" y1="204" x2="270" y2="204"/><line x1="36" y1="218" x2="285" y2="218"/>
    <line x1="36" y1="232" x2="240" y2="232"/><line x1="36" y1="246" x2="275" y2="246"/><line x1="36" y1="260" x2="260" y2="260"/>
    <line x1="36" y1="274" x2="280" y2="274"/><line x1="36" y1="288" x2="230" y2="288"/><line x1="36" y1="302" x2="270" y2="302"/>
    <line x1="36" y1="316" x2="250" y2="316"/><line x1="36" y1="330" x2="180" y2="330"/>
    <line x1="36" y1="374" x2="275" y2="374"/><line x1="36" y1="388" x2="260" y2="388"/><line x1="36" y1="402" x2="210" y2="402"/>
  </g>

  <!-- Chunks como bandas -->
  <rect x="325" y="92" width="22" height="64" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="325" y="162" width="22" height="114" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="352" y="240" width="22" height="98" rx="4" fill="#f9a8d4" stroke="#db2777" stroke-width="1.5"/>
  <rect x="352" y="240" width="22" height="36" fill="url(#hatch)"/>
  <rect x="325" y="240" width="22" height="36" fill="url(#hatch)"/>
  <rect x="325" y="346" width="22" height="64" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>

  <g font-size="12" fill="#b45309">
    <text x="20" y="470" fill="#b45309">▨ solape ≈ 50 tokens: el texto de la frontera vive en los dos</text>
  </g>

  <!-- etiquetas y flechas -->
  <g font-size="13" font-weight="600">
    <text x="396" y="128" fill="#1d4ed8">Chunk 1 · Plazos</text>
    <text x="396" y="210" fill="#6d28d9">Chunk 2 · Reembolsos (1/2)</text>
    <text x="396" y="300" fill="#be185d">Chunk 3 · Reembolsos (2/2)</text>
    <text x="396" y="382" fill="#15803d">Chunk 4 · Excepciones</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="590" y1="124" x2="626" y2="124"/>
    <line x1="590" y1="206" x2="626" y2="206"/>
    <line x1="590" y1="296" x2="626" y2="296"/>
    <line x1="590" y1="378" x2="626" y2="378"/>
  </g>
  <g font-size="12" fill="#334155" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
    <text x="634" y="128">[0,12, −0,08, …]</text>
    <text x="634" y="210">[0,31, 0,02, …]</text>
    <text x="634" y="300">[0,27, 0,05, …]</text>
    <text x="634" y="382">[−0,04, 0,19, …]</text>
  </g>
  <text x="396" y="146" font-size="11" fill="#64748b">sección corta: un Chunk entero</text>
  <text x="396" y="228" font-size="11" fill="#64748b">sección de más de ~400 tokens:</text>
  <text x="396" y="242" font-size="11" fill="#64748b">se parte por párrafos…</text>
  <text x="396" y="318" font-size="11" fill="#64748b">…y el corte se solapa con el anterior</text>

  <!-- todos a la misma nota -->
  <rect x="560" y="440" width="245" height="30" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="682" y="460" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Cita: [[Política de cancelaciones]]</text>
  <text x="682" y="428" text-anchor="middle" font-size="11" fill="#64748b">cualquiera de los 4 que salga lleva aquí</text>
</svg>
